<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">  

    <title>My To-Do List</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>My To-Do List</h1>

    <input type="text" id="todoInput" placeholder="เพิ่มงาน...">
    <button class="add-button" onclick="addTodo()">เพิ่ม</button>
    <div class="filter-area">
    <button onclick="filterTodos('all')">ทั้งหมด</button>
    <button onclick="filterTodos('active')">ยังไม่เสร็จ</button>
    <button onclick="filterTodos('completed')">เสร็จแล้ว</button>
</div>

<ul id="todoList"></ul>

    <script src="script.js"></script>
</body>
</html>
